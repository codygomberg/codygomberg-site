  <!-- Lightbox -->
  <div id="lightbox" aria-hidden="true">
    <button id="lb-close" aria-label="Close">✕</button>
    <button id="lb-prev" aria-label="Previous">&#8592;</button>
    <button id="lb-next" aria-label="Next">&#8594;</button>
    <div id="lb-content">
      <img id="lb-img" src="" alt="">
      <div id="lb-caption">
        <span id="lb-location"></span>
        <span id="lb-date"></span>
      </div>
    </div>
  </div>

  <script>
    const items = document.querySelectorAll('.photo-item');
    const lightbox = document.getElementById('lightbox');
    const lbImg = document.getElementById('lb-img');
    const lbLocation = document.getElementById('lb-location');
    const lbDate = document.getElementById('lb-date');
    let current = 0;

    function open(index) {
      current = index;
      const item = items[index];
      const sectionTitle = item.closest('.photo-section').querySelector('.photo-section-title').textContent;
      const [location, date] = sectionTitle.split(' — ');
      lbImg.src = item.querySelector('img').src;
      lbImg.alt = item.querySelector('img').alt;
      lbLocation.textContent = location;
      lbDate.textContent = date;
      lightbox.classList.add('active');
      lightbox.setAttribute('aria-hidden', 'false');
      document.body.style.overflow = 'hidden';
    }

    function close() {
      lightbox.classList.remove('active');
      lightbox.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
    }

    function prev() { open((current - 1 + items.length) % items.length); }
    function next() { open((current + 1) % items.length); }

    items.forEach((item, i) => item.addEventListener('click', () => open(i)));
    document.getElementById('lb-close').addEventListener('click', close);
    document.getElementById('lb-prev').addEventListener('click', prev);
    document.getElementById('lb-next').addEventListener('click', next);
    lightbox.addEventListener('click', e => { if (e.target === lightbox) close(); });
    document.addEventListener('keydown', e => {
      if (!lightbox.classList.contains('active')) return;
      if (e.key === 'Escape') close();
      if (e.key === 'ArrowLeft') prev();
      if (e.key === 'ArrowRight') next();
    });
  </script>
